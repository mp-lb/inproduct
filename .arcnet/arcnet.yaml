version: 1
project: inproduct
repository: mp-lb/inproduct
environment: mp-lb
approved: false
secrets:
  sources:
    - key: SECRETS_KEY
      store: mp-lb/mp-lb
      path: /admin/standard-secrets.json.enc
    - key: INPRODUCT_SECRETS_KEY
      store: mp-lb/mp-lb
      path: /projects/inproduct/secrets.json.enc
  consumers:
    publish:
      NPM_TOKEN:
        - NPM_TOKEN
        - NODE_AUTH_TOKEN
      NODE_AUTH_TOKEN:
        - NPM_TOKEN
        - NODE_AUTH_TOKEN
      pnpm_config_//registry.npmjs.org/:_authToken:
        - NPM_TOKEN
        - NODE_AUTH_TOKEN
