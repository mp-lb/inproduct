project: inproduct
env-files:
  - .env.local
  - .env
homepage: http://localhost:${LANDING_PAGE_PORT}
links:
  - name: MyShop
    url: http://127.0.0.1:${MYSHOP_FRONTEND_PORT}
ports:
  - MONGO_PORT
  - FILE_MONGO_PORT
  - MYSHOP_BACKEND_PORT
  - LANDING_PAGE_PORT
  - DOCS_PORT
  - MYSHOP_FRONTEND_PORT
docker:
  file-mongodb:
    image: mongodb/mongodb-atlas-local:latest
    ports:
      - "127.0.0.1:${FILE_MONGO_PORT}:27017"
    volumes:
      - /data/db
  mongodb:
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - /data/db
native:
  docs:
    cmd: CHOKIDAR_USEPOLLING=1 pnpm --filter @mp-lb/inproduct-docs dev
    env: "*"
  myshop-frontend:
    cmd: pnpm --filter @mp-lb/inproduct-myshop-frontend dev --host 127.0.0.1 --port ${MYSHOP_FRONTEND_PORT}
    env: "*"
  landing-page:
    cmd: pnpm --filter @mp-lb/inproduct-landing-page dev --host 0.0.0.0 --port ${LANDING_PAGE_PORT}
    env: "*"
  myshop-backend:
    cmd: pnpm --filter @mp-lb/inproduct-myshop-backend dev
    env: "*"
tasks:
  validation:
    cmds:
      - pnpm exec tsx packages/scripts/runValidation.ts {{REST}}
  validation-test:
    cmds:
      - pnpm exec tsx --test packages/scripts/validation.test.ts
  validation-check:
    cmds:
      - pnpm exec eslint packages/scripts/runValidation.ts packages/scripts/validation packages/scripts/validation.test.ts
      - pnpm --dir packages/scripts run typecheck
  scripts:
    desc: Introduce this project
    cmds:
      - pnpm --dir packages/scripts exec tsx index.ts
  scripts-check:
    desc: Lint and typecheck project scripts
    cmds:
      - pnpm exec eslint packages/scripts
      - pnpm --dir packages/scripts run typecheck
  scripts-test:
    cmds:
      - pnpm exec tsx --test packages/scripts/*.test.ts packages/scripts/publishing/*.test.ts
  docs-scripts-check:
    cmds:
      - pnpm exec eslint apps/docs/scripts tests/docs/*.ts
      - pnpm exec tsc -p apps/docs/tsconfig.scripts.json --noEmit
  augment-docs-site:
    cmds:
      - pnpm exec tsx packages/scripts/augmentDocsSite.ts {{REST}}
  publish-packages:
    cmds:
      - pnpm exec tsx packages/scripts/autoPublish.ts {{REST}}
  verify-publication:
    env: "*"
    cmds:
      - pnpm exec tsx packages/scripts/verifyPublication.ts
  mongo-test:
    env: "*"
    cmds:
      - INPRODUCT_MONGO_TEST_URI="mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" pnpm --filter @mp-lb/inproduct-storage exec vitest run src/mongoAdapters.test.ts
  data-jobs-test:
    desc: Run data-jobs and MyShop data-jobs tests against the local MongoDB
    env: "*"
    cmds:
      - INPRODUCT_MONGO_TEST_URI="mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" pnpm --filter @mp-lb/inproduct-data-jobs test
      - INPRODUCT_MONGO_TEST_URI="mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" pnpm --filter @mp-lb/inproduct-myshop-backend test
  file-metadata-test:
    env: "*"
    cmds:
      - cd packages/storage && INPRODUCT_MONGO_FILE_TEST_URI="mongodb://127.0.0.1:${FILE_MONGO_PORT}/?directConnection=true" ../../node_modules/.bin/vitest run src/createMongoFileMetadataRepository.test.ts src/file-library/tests/mongoFileLibrary.test.ts --maxWorkers=1
  docs-check:
    cmds:
      - pnpm docs:check
  docs-test:
    cmds:
      - pnpm docs:test
  docs-prepare-preview:
    cmds:
      - pnpm exec tsx apps/docs/scripts/prepareDocsPreview.ts
  docs-verify:
    cmds:
      - pnpm exec tsx apps/docs/scripts/checkDocs.ts
  docs-preview:
    env: "*"
    cmds:
      - pnpm --filter @mp-lb/inproduct-docs start
  myshop:
    cmds:
      - pnpm exec tsx packages/scripts/runValidation.ts -- pnpm --filter @mp-lb/inproduct --filter @mp-lb/inproduct-storage --filter @mp-lb/inproduct-data-jobs build
      - zap up myshop-backend myshop-frontend
  myshop-data-jobs:
    desc: Run MyShop data jobs from the command line against the local MongoDB
    env: "*"
    cmds:
      - pnpm --filter @mp-lb/inproduct-data-jobs build
      - pnpm --filter @mp-lb/inproduct-myshop-backend exec tsx src/dataJobsCli.ts {{REST}}
  myshop-check:
    cmds:
      - pnpm exec tsx packages/scripts/runValidation.ts -- pnpm --filter @mp-lb/inproduct-myshop-backend build:local
      - pnpm exec tsx packages/scripts/runValidation.ts -- pnpm --filter @mp-lb/inproduct-myshop-frontend build:local
  context-build:
    cmds:
      - |
        set -eu
        context_temp=$(mktemp -d)
        trap 'rm -rf "$context_temp"' EXIT
        mdcompile context/index.md --silent -o "$context_temp/local.md"
        fm compile --stdin -o "$context_temp/shared.md" < "$context_temp/local.md"
        cp "$context_temp/shared.md" AGENTS.md
        cp "$context_temp/shared.md" CLAUDE.md
  setup:
    cmds:
      - pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - pnpm install
      - cp "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.env" . 2>/dev/null || true
