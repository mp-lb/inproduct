project: inproduct
env-files:
  - .env.local
  - .env
homepage: http://localhost:${LANDING_PAGE_PORT}
links:
  - name: MyShop
    url: http://127.0.0.1:${MYSHOP_FRONTEND_PORT}
ports:
  - MONGO_PORT
  - MYSHOP_BACKEND_PORT
  - LANDING_PAGE_PORT
  - DOCS_PORT
  - MYSHOP_FRONTEND_PORT
docker:
  mongodb:
    image: mongo:latest
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - /data/db
native:
  docs:
    cmd: CHOKIDAR_USEPOLLING=1 pnpm --filter @mp-lb/inproduct-docs dev
    env: "*"
  myshop-frontend:
    cmd: pnpm --filter @mp-lb/inproduct-myshop-frontend dev --host 127.0.0.1 --port ${MYSHOP_FRONTEND_PORT}
    env: "*"
  landing-page:
    cmd: pnpm --filter @mp-lb/inproduct-landing-page dev --host 0.0.0.0 --port ${LANDING_PAGE_PORT}
    env: "*"
  myshop-backend:
    cmd: pnpm --filter @mp-lb/inproduct-myshop-backend dev
    env: "*"
tasks:
  mongo-test:
    env: "*"
    cmds:
      - INPRODUCT_MONGO_TEST_URI="mongodb://127.0.0.1:${MONGO_PORT}/?directConnection=true" pnpm --filter @mp-lb/inproduct-storage exec vitest run src/mongoAdapters.test.ts
  docs-preview:
    env: "*"
    cmds:
      - pnpm --filter @mp-lb/inproduct-docs start
  myshop:
    cmds:
      - python3 scripts/run_validation.py -- pnpm --filter @mp-lb/inproduct --filter @mp-lb/inproduct-storage build
      - zap up myshop-backend myshop-frontend
  myshop-check:
    cmds:
      - python3 scripts/run_validation.py -- pnpm --filter @mp-lb/inproduct-myshop-backend build:local
      - python3 scripts/run_validation.py -- pnpm --filter @mp-lb/inproduct-myshop-frontend build:local
  context-build:
    cmds:
      - npx -y @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o AGENTS.md
      - npx -y @mp-lb/mdcompile context/index.md --optional --silent | fm compile --stdin -o CLAUDE.md
  setup:
    cmds:
      - python3 scripts/run_validation.py -- pnpm install
  build:
    cmds:
      - pnpm build
  lint:
    cmds:
      - |
        if [ -n "{{REST}}" ]; then
          pnpm exec eslint {{REST}}
        else
          pnpm lint
        fi
  check:
    cmds:
      - zap task lint -- {{REST}}
      - pnpm typecheck
  typecheck:
    cmds:
      - pnpm typecheck
  test:
    cmds:
      - pnpm test
  worktree-setup:
    cmds:
      - python3 scripts/run_validation.py -- pnpm install
      - cp "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.env" . 2>/dev/null || true
      - zap task context-build
