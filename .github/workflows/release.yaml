name: Release npm packages

on:
  push:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'mp-lb/inproduct'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
        env:
          INPRODUCT_MONGO_TEST_URI: mongodb://127.0.0.1:27017/?directConnection=true
      - name: Publish changed package builds
        id: publish
        run: pnpm exec arcnet env run --consumer publish -- packages/scripts/node_modules/.bin/tsx
          packages/scripts/autoPublish.ts --github-output="$GITHUB_OUTPUT"
        env:
          INPRODUCT_SECRETS_KEY: ${{ secrets.INPRODUCT_SECRETS_KEY }}
          ARCNET_STANDARD_SECRETS_KEY: ${{ secrets.ARCNET_STANDARD_SECRETS_KEY }}
      - name: Verify public registry packages
        run: pnpm exec tsx packages/scripts/verifyPublication.ts
        env:
          FSSSTACK_RELEASE_RESULT: ${{ steps.publish.outputs.release_report }}
