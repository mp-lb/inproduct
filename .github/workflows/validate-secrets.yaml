name: Validate encrypted credentials
on:
  push:
    branches: [main]
    paths:
      - ".secrets/**"
      - "scripts/secrets/**"
      - ".github/workflows/validate-secrets.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'mp-lb/inproduct' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test scripts/secrets/*.test.mjs
      - name: Validate decryption and required fields only
        run: node scripts/secrets/run.mjs validate
        env:
          SECRETS_KEY: ${{ secrets.SECRETS_KEY }}
