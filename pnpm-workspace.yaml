packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  fs-ext: true
  msw: true

minimumReleaseAge: 5
minimumReleaseAgeExclude:
  - '@mp-lb/monolith-mapper@0.1.2'
  - lucide-react@1.47.0
  - '@mp-lb/arcnet@0.2.0'
  - '@mp-lb/arcnet@0.4.0'
  - '@mp-lb/zapper@0.21.4'

# Save exact external versions; internal dependencies use workspace:*.
saveExact: true
